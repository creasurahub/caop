  /v1/compact/stage-work:
    post:
      operationId: "compact.stage_work"
      summary: "Stage work"
      description: "UNDERSTAND → COMMIT → PLAN. Evaluates Policy pre-commit hooks and minimum_attestation, then halts at approval (COMMIT_AWAITING_APPROVAL) or at EXECUTE_PENDING. A failed hook keeps the work item in CANDIDATE_PROPOSAL and returns CAOP_422_PRECOMMIT_HOOK_FAILED with details.failed_hooks; unknown or cross-workspace fact IDs return CAOP_422_PRECOMMIT_UNKNOWN_FACT_ID. Rejected with CAOP_409_UNSETTLED_EXECUTION_LEASE while a lease is open. v0.2: parent_work_id and isolation_policy stage a child work scope; it inherits the parent’s authority and can only narrow it."
      tags:
        - "Compact binding"
      x-caop-stage:
        - "Understand"
        - "Commit"
        - "Plan"
      x-caop-binding: "compact"
      x-caop-mcp-tool: "caop_stage_work"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageWorkInput"
            example:
              goal_id: "goal_q4_strategy"
              parent_work_id: "wrk_q4_strategy_master"
              isolation_policy:
                execution_scope: "ISOLATED_SUBAGENT_CONTEXT"
                return_contract: "DISTILLED_FACTS_AND_ARTIFACT_REF_ONLY"
                max_token_budget: 16000
                prune_raw_traces_on_record: true
                retention_policy: "retain_30_days"
              understanding:
                intent_summary: "Benchmark vendor latency and pricing for the Q4 strategy RFC."
                derived_facts: []
              commitment:
                title: "Market benchmark matrix"
                rationale: "The parent RFC needs verified latency and pricing comparisons."
                owner_principal_id: "user_123"
                reversible: true
              plan_steps:
                - step_index: 1
                  capability_id: "research.web"
                  arguments:
                    query: "vendor p99 latency published benchmarks"
      responses:
        "200":
          description: "Staged"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageWorkResult"
              example:
                work_id: "wrk_rfc_sharding_10"
                lifecycle_stage: "COMMIT"
                sub_state: "COMMIT_AWAITING_APPROVAL"
                epistemic_status: "CANDIDATE_PROPOSAL"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthenticated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Forbidden or approval required"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Unsettled execution lease (CAOP_409_UNSETTLED_EXECUTION_LEASE), invalid transition, or state version conflict"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "CAOP_409_UNSETTLED_EXECUTION_LEASE"
                  message: "Settle the open execution lease (inv_99481A) via caop_settle_receipt before staging or dispatching new work."
                  retryable: false
                  details:
                    blocking_work_id: "wrk_01J9Z8K4M2"
                    blocking_invocation_id: "inv_99481A"
                    required_nonce: "nnc_884920_x9"
                trace_id: "trace_7c41e3"
        "422":
          description: "Pre-commit hook failed (CAOP_422_PRECOMMIT_*) or receipt nonce / artifact mismatch (CAOP_422_VERIFY_ARTIFACT_MISMATCH)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "CAOP_422_PRECOMMIT_HOOK_FAILED"
                  message: "One or more Policy pre-commit hooks failed. The work item remains in CANDIDATE_PROPOSAL."
                  retryable: false
                  details:
                    failed_hooks:
                      - hook_id: "REQUIRE_EXPLICIT_OWNER"
                        error_code: "CAOP_422_PRECOMMIT_MISSING_OWNER"
                        remediation: "Specify commitment.owner_principal_id (or ask the user to assign an owner) before committing this work plan."
                trace_id: "trace_7c41e2"
  /v1/compact/dispatch-work:
    post:
      operationId: "compact.dispatch_work"
      summary: "Dispatch work"
      description: "COMMIT resolution → EXECUTE. HOST_DELEGATED: enters EXECUTE_DISPATCHED and returns the anti-termination DispatchDirective with a single-use nonce. KERNEL_PROXIED: runs the OAuth proxy call and auto-folds VERIFY + RECORD, returning a SettlementResult. Rejected with CAOP_409_UNSETTLED_EXECUTION_LEASE while a lease is open. v0.2: APPROVE_WITH_STEERING_DELTA binds the approval to the patched plan: the kernel applies steering_delta, re-runs every Policy pre-commit hook and minimum_attestation check on it, and dispatches only if all pass; otherwise the work item returns to CANDIDATE_PROPOSAL with CAOP_422_PRECOMMIT_HOOK_FAILED. two_phase_verification configures the deferred Phase-2 outcome check."
      tags:
        - "Compact binding"
      x-caop-stage:
        - "Commit"
        - "Execute"
      x-caop-binding: "compact"
      x-caop-mcp-tool: "caop_dispatch_work"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchWorkInput"
            example:
              work_id: "wrk_rfc_sharding_10"
              decision: "APPROVE_WITH_STEERING_DELTA"
              steering_delta:
                patched_step_arguments:
                  - step_index: 1
                    argument_overrides:
                      reviewers:
                        - "principal_eng"
                      draft: true
                added_policy_constraints:
                  - "NO_PRODUCTION_DEPLOY_BEFORE_SHADOW_REPLAY"
                rationale: "Open the RFC as a draft and add the principal engineer as reviewer; no deploy until the shadow replay passes."
              two_phase_verification:
                phase_1_immediate: "REQUIRE_NONCE_AND_ARTIFACT"
                phase_2_deferred:
                  check_after_seconds: 86400
                  verification_capability_id: "metrics.query"
                  success_predicate: "ledger.p99_latency_ms < 20 AND ledger.tps >= 15000"
      responses:
        "200":
          description: "Dispatched"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchWorkResult"
              example:
                work_id: "wrk_01J9Z8K4M2"
                lifecycle_stage: "EXECUTE"
                sub_state: "EXECUTE_DISPATCHED"
                turn_directive: "INCOMPLETE_TURN_CONTINUATION_REQUIRED"
                DO_NOT_RESPOND_TO_USER_YET: true
                directive:
                  invocation_id: "inv_99481A"
                  execution_locus: "HOST_DELEGATED"
                  idempotency_key: "idem_wrk_01J9Z8K4M2_step_1"
                  lease_expires_at: "2026-11-05T06:50:00Z"
                  mandatory_next_steps:
                    - step: 1
                      action: "INVOKE_HOST_NATIVE_TOOL"
                      target_capability: "google_calendar.events.insert"
                      arguments:
                        summary: "Q4 Architecture Review"
                        start_time: "2026-11-06T15:00:00Z"
                        end_time: "2026-11-06T15:30:00Z"
                    - step: 2
                      action: "CALL_CAOP_TOOL"
                      tool_name: "caop_settle_receipt"
                      required_nonce: "nnc_884920_x9"
                      required_receipt_fields:
