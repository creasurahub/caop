                        - "htmlLink"
                        - "iCalUID"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthenticated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Forbidden or approval required"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Unsettled execution lease (CAOP_409_UNSETTLED_EXECUTION_LEASE), invalid transition, or state version conflict"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "CAOP_409_UNSETTLED_EXECUTION_LEASE"
                  message: "Settle the open execution lease (inv_99481A) via caop_settle_receipt before staging or dispatching new work."
                  retryable: false
                  details:
                    blocking_work_id: "wrk_01J9Z8K4M2"
                    blocking_invocation_id: "inv_99481A"
                    required_nonce: "nnc_884920_x9"
                trace_id: "trace_7c41e3"
        "413":
          description: "Invalidation subgraph too large (CAOP_413_INVALIDATION_SUBGRAPH_TOO_LARGE); nothing was applied"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "Pre-commit hook failed (CAOP_422_PRECOMMIT_*) or receipt nonce / artifact mismatch (CAOP_422_VERIFY_ARTIFACT_MISMATCH)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "CAOP_422_PRECOMMIT_HOOK_FAILED"
                  message: "The patched plan failed a Policy pre-commit hook. The work item returns to CANDIDATE_PROPOSAL."
                  retryable: false
                  details:
                    failed_hooks:
                      - hook_id: "REQUIRE_EXPLICIT_OWNER"
